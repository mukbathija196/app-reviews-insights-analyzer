name: Weekly Pulse

on:
  workflow_dispatch:
    inputs:
      iso_week:
        description: "Optional ISO week (e.g. 2026-W16)"
        required: false
      recipient_email:
        description: "Optional email to send the report to (defaults to configured stakeholders)"
        required: false

jobs:
  groww:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Sync dependencies
        run: uv sync --extra reasoning

      - name: Cache HuggingFace
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Run weekly pulse (live MCP delivery in send mode)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PULSE_DATA_DIR: data
          # Inputs go through env vars, never inline ${{ }} in the script (shell injection).
          ISO_WEEK: ${{ github.event.inputs.iso_week }}
          RECIPIENT_EMAIL: ${{ github.event.inputs.recipient_email }}
        run: |
          args=(--product groww --email-mode send)
          if [ -n "$ISO_WEEK" ]; then
            args+=(--iso-week "$ISO_WEEK")
          fi
          if [ -n "$RECIPIENT_EMAIL" ]; then
            # Public repo: keep the address out of the run logs.
            echo "::add-mask::$RECIPIENT_EMAIL"
            args+=(--to "$RECIPIENT_EMAIL")
          fi
          uv run pulse run "${args[@]}"

      - name: Upload run records artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulse-run-data-${{ github.run_id }}
          path: data/runs/*.json
          if-no-files-found: warn
